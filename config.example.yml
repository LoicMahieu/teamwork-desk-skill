# Configuration exemple pour le Support CLI
# Copier ce fichier en config.yml et l'adapter à vos besoins

teamwork:
  domain: "yourcompany.teamwork.com"
  # api_key: sera pris depuis la variable d'environnement TEAMWORK_DESK_API_KEY

# Configuration de l'analyse
analysis:
  default_inbox_id: 4364
  time_window_days: 14
  default_message_type: "note"  # "note" ou "reply"

# Templates de messages
templates:
  note:
    subject: "Analyse interne - Ticket {{ ticket_id }}"
    structure: |
      **Contexte** — {{ contexte }}
      **Action effectuée** — Analyse du ticket + recherche documentaire
      **Prochaine étape** — {{ prochaine_etape }}

      **Résumé** — {{ resume }}

      **Analyse** — {{ analyse }}

      **Liens de documentation** — {{ liens }}

      **Proposition de réponse** — {{ proposition }}
  reply:
    subject: "Re: {{ ticket_subject }}"
    structure: |
      Bonjour,

      {{ proposition }}

      Cordialement,
      L'équipe Support

# Configuration de la recherche documentaire
docs:
  search_url: "https://foldio-app-docs.vercel.app/api/search"
  default_locale: "fr"
  max_results: 5
